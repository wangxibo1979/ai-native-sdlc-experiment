name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import unittest, sys
          result = unittest.TextTestRunner().run(unittest.TestSuite())
          print('EXECUTED_TESTS=' + str(result.testsRun))
          sys.exit(not result.wasSuccessful())
          PY
